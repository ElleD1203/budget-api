<!DOCTYPE html>
<html>
<head>
    <title>Budget API UI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: white;
        }

        .button-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        button {
            width: 130px;
            height: 35px;
            font-size: 18px;
            border: 3px double green;
            background-color: white;
            cursor: pointer;
        }

        .delete-button {
            background-color: #d8642a;
            color: white;
            border: 3px double #7a2d0c;
            font-weight: bold;
        }

        table {
            width: 800px;
            border-collapse: collapse;
            font-size: 18px;
        }

        th, td {
            border: 1px solid black;
            height: 35px;
            text-align: left;
            padding-left: 10px;
        }

        th {
            font-weight: bold;
        }

        .chart-card {
    width: 800px;
    border: 1px solid black;
    padding: 20px;
    margin-bottom: 40px;
}

        .chart-card h3 {
            margin-top: 0;
            font-size: 20px;
        }

        .chart-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .chart-label {
            width: 90px;
            font-size: 16px;
        }

        .bar-container {
            width: 500px;
            height: 28px;
            border: 1px solid black;
            margin-right: 15px;
        }

        .bar {
            height: 100%;
            width: 0%;
            background-color: green;
        }

        .negative-bar {
            background-color: orange;
        }

        .chart-value {
            width: 120px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="button-row">
        <button onclick="addTransaction()">Add</button>
        <button onclick="updateTransaction()">Update</button>
        <button class="delete-button" onclick="deleteTransaction()">Delete</button>
        <button onclick="getSummary()">Summary</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>date</th>
                <th>merchant</th>
                <th>amount</th>
                <th>transaction_type</th>
            </tr>
        </thead>

        <tbody id="transaction-table">
        </tbody>
    </table>

    <script>
        const API_URL = "http://127.0.0.1:8001";

        async function loadTransactions() {
            const response = await fetch(`${API_URL}/api/v1/transactions`);
            const transactions = await response.json();

            const tableBody = document.getElementById("transaction-table");
            tableBody.innerHTML = "";

            transactions.forEach(transaction => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${transaction.date}</td>
                    <td>${transaction.merchant}</td>
                    <td>${transaction.amount}</td>
                    <td>${transaction.transaction_type}</td>
                `;

                tableBody.appendChild(row);
            });
        }


async function addTransaction() {
    const date = prompt("Enter date, example: 2026-07-10");
    const merchant = prompt("Enter merchant, example: Costco");
    const amountInput = prompt("Enter amount, example: -180.50");

    if (!date || !merchant || !amountInput) {
        alert("Date, merchant, and amount are required.");
        return;
    }

    const amount = Number(amountInput);

    if (Number.isNaN(amount)) {
        alert("Amount must be a number.");
        return;
    }

    const response = await fetch(`${API_URL}/api/v1/transactions`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            date: date,
            merchant: merchant,
            amount: amount
        })
    });

    if (!response.ok) {
        const errorText = await response.text();
        alert("Add failed: " + errorText);
        return;
    }

    const result = await response.json();
    console.log("Created transaction:", result);

    loadTransactions();
}

        async function updateTransaction() {
            const transactionId = prompt("Enter transaction ID to update");

            const date = prompt("Enter new date, or leave blank");
            const merchant = prompt("Enter new merchant, or leave blank");
            const amountInput = prompt("Enter new amount, or leave blank");

            const updateData = {};

            if (date !== "") {
                updateData.date = date;
            }

            if (merchant !== "") {
                updateData.merchant = merchant;
            }

            if (amountInput !== "") {
                updateData.amount = Number(amountInput);
            }

            await fetch(`${API_URL}/api/v1/transactions/${transactionId}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updateData)
            });

            loadTransactions();
        }

        async function deleteTransaction() {
            const transactionId = prompt("Enter transaction ID to delete");

            await fetch(`${API_URL}/api/v1/transactions/${transactionId}`, {
                method: "DELETE"
            });

            loadTransactions();
        }

        async function getSummary() {
            const date = prompt("Enter date for summary, or leave blank for all transactions");

            let url = `${API_URL}/api/v1/summary`;

            if (date !== "") {
                url = `${API_URL}/api/v1/summary?date=${date}`;
            }

            const response = await fetch(url);
            const summary = await response.json();

            alert(
                `Date: ${summary.date}\n` +
                `Total income: ${summary.total_income}\n` +
                `Total expense: ${summary.total_expense}\n` +
                `Net amount: ${summary.net_amount}`
            );
        }

        async function loadSummaryChart() {
            const response = await fetch(`${API_URL}/api/v1/summary/chart`);
            const summary = await response.json();

            const positiveTotal = summary.total_positive;
            const negativeTotalForChart = summary.total_negative_for_chart;
            const rawNegativeTotal = summary.total_negative;

            const maxValue = Math.max(positiveTotal, negativeTotalForChart);

            let positiveWidth = 0;
            let negativeWidth = 0;

            if (maxValue > 0) {
                positiveWidth = (positiveTotal / maxValue) * 100;
                negativeWidth = (negativeTotalForChart / maxValue) * 100;
            }

            document.getElementById("positive-bar").style.width = positiveWidth + "%";
            document.getElementById("negative-bar").style.width = negativeWidth + "%";

            document.getElementById("positive-value").innerText = "$" + positiveTotal.toFixed(2);
            document.getElementById("negative-value").innerText = "$" + rawNegativeTotal.toFixed(2);
}


        loadTransactions();
        loadSummaryChart();
    </script>

</body>
</html>


<div class="chart-card">
    <h3>Positive Amount vs Negative Amount</h3>

    <div class="chart-row">
        <div class="chart-label">Positive</div>
        <div class="bar-container">
            <div id="positive-bar" class="bar"></div>
        </div>
        <div id="positive-value" class="chart-value"></div>
    </div>

    <div class="chart-row">
        <div class="chart-label">Negative</div>
        <div class="bar-container">
            <div id="negative-bar" class="bar negative-bar"></div>
        </div>
        <div id="negative-value" class="chart-value"></div>
    </div>
</div>
